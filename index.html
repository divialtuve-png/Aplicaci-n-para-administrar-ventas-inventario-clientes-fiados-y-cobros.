<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mi Negocio Fácil — Prototipo</title><style>:root{font-family:system-ui,-apple-system,sans-serif;color:#211c3d;background:#f4f3fc}*{box-sizing:border-box}body{margin:0}header{background:linear-gradient(115deg,#43277a,#4775f5);color:white;padding:22px 18px}header h1{margin:0;font-size:23px}header small{opacity:.85}.wrap{max-width:760px;margin:auto}main{padding:15px 15px 90px}.card{background:white;border-radius:16px;padding:16px;margin:12px 0;box-shadow:0 3px 15px #20104a0c}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.metric{background:#f5f2ff;padding:13px;border-radius:12px}.metric small{display:block;color:#655e7a}.metric strong{font-size:21px}button{border:0;border-radius:11px;padding:12px;background:#5426ba;color:white;font-weight:650;cursor:pointer}button.secondary{background:#e9e5fa;color:#43277a}input,select{width:100%;padding:12px;border:1px solid #d8d3e7;border-radius:10px;background:white;font:inherit;margin:5px 0 12px}label{font-size:13px;color:#5b5570}nav{position:fixed;bottom:0;left:0;right:0;background:white;border-top:1px solid #eee;display:flex;justify-content:center;padding:8px;gap:5px}nav button{background:transparent;color:#544c6a;font-size:11px;flex:1;max-width:125px;padding:9px 2px}nav button.active{background:#eee7ff;color:#5025aa}.line{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid #f0edf7}.line:last-child{border:0}.muted{color:#777087;font-size:12px}.pill{background:#eee8ff;color:#5224a8;border-radius:99px;padding:4px 9px;font-size:12px}.hide{display:none}.error{color:#b3261e}.success{color:#087a54}h2{font-size:20px;margin:8px 0}h3{font-size:16px;margin:0 0 8px}.full{width:100%}.banner{background:#e8f1ff;padding:10px;border-radius:10px;font-size:12px;margin-top:10px}</style></head><body><div class="wrap"><header><h1>▣ Mi Negocio Fácil</h1><small id="subtitle">Prototipo local · morado + azul eléctrico</small></header><main><section id="access" class="card"><h2>Elegir negocio de prueba</h2><p class="muted">Dos negocios ficticios con datos separados en este navegador. Esto NO es autenticación segura.</p><select id="tenant"><option value="bodega">Bodega Mi Esquina</option><option value="kiosco">Kiosco Central</option></select><button class="full" onclick="enter()">Entrar a la demostración</button></section><div id="app" class="hide"><section id="home"></section><section id="sale" class="hide"></section><section id="stock" class="hide"></section><section id="credit" class="hide"></section><section id="reports" class="hide"></section><p id="message" role="status"></p></div></main><nav id="nav" class="hide"><button data-tab="home" onclick="tab('home')">⌂<br>Inicio</button><button data-tab="sale" onclick="tab('sale')">🛒<br>Venta</button><button data-tab="stock" onclick="tab('stock')">▣<br>Inventario</button><button data-tab="credit" onclick="tab('credit')">▤<br>Fiados</button><button data-tab="reports" onclick="tab('reports')">▥<br>Reportes</button></nav></div><script>
const seed=()=>({products:[{id:1,name:'Arroz 1 kg',price:4.5,cost:3.5,stock:35},{id:2,name:'Aceite 1 L',price:8.5,cost:6.5,stock:12},{id:3,name:'Azúcar 1 kg',price:4,cost:3,stock:3}],clients:[{id:1,name:'María López'},{id:2,name:'Juan Pérez'}],sales:[],payments:[]});let business='',db=null,screen='home';const money=n=>'S/ '+Number(n).toFixed(2);const el=id=>document.getElementById(id);const safe=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function save(){localStorage.setItem('mnf-demo-'+business,JSON.stringify(db))}function enter(){business=el('tenant').value;try{db=JSON.parse(localStorage.getItem('mnf-demo-'+business))||seed()}catch{db=seed()}el('access').classList.add('hide');el('app').classList.remove('hide');el('nav').classList.remove('hide');el('subtitle').textContent=(business==='bodega'?'Bodega Mi Esquina':'Kiosco Central')+' · DEMO LOCAL';tab('home')}function tab(t){screen=t;for(const id of ['home','sale','stock','credit','reports'])el(id).classList.toggle('hide',id!==t);document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('active',b.dataset.tab===t));el('message').textContent='';render()}function debt(id){return db.sales.filter(x=>x.clientId===id).reduce((s,x)=>s+x.total,0)-db.payments.filter(x=>x.clientId===id).reduce((s,x)=>s+x.amount,0)}function render(){const revenue=db.sales.reduce((s,x)=>s+x.total,0),cash=db.sales.filter(x=>!x.clientId).reduce((s,x)=>s+x.total,0),out=db.clients.reduce((s,c)=>s+debt(c.id),0),paid=db.payments.reduce((s,p)=>s+p.amount,0),profit=db.sales.reduce((s,x)=>s+x.profit,0);el('home').innerHTML=`<h2>Resumen del negocio</h2><div class="grid"><div class="metric"><small>Ventas</small><strong>${money(revenue)}</strong></div><div class="metric"><small>Ganancia bruta estimada</small><strong>${money(profit)}</strong></div><div class="metric"><small>Fiados pendientes</small><strong>${money(out)}</strong></div><div class="metric"><small>Cobros de fiados</small><strong>${money(paid)}</strong></div></div><div class="card"><h3>Acciones rápidas</h3><button onclick="tab('sale')">+ Nueva venta</button> <button class="secondary" onclick="tab('credit')">Registrar cobro</button></div><p class="banner">Datos ficticios guardados solo en este navegador. No usar para operaciones reales.</p>`;el('sale').innerHTML=`<h2>Nueva venta</h2><div class="card"><label>Producto</label><select id="saleProduct">${db.products.map(p=>`<option value="${p.id}">${safe(p.name)} · ${money(p.price)} · stock ${p.stock}</option>`).join('')}</select><label>Cantidad</label><input id="saleQty" type="number" min="1" step="1" value="1"><label>Tipo de venta</label><select id="saleClient"><option value="">Al contado</option>${db.clients.map(c=>`<option value="${c.id}">Fiado: ${safe(c.name)}</option>`).join('')}</select><label>Medio de pago (contado)</label><select id="saleMethod"><option>Efectivo</option><option>Yape</option><option>Plin</option><option>Transferencia</option></select><button class="full" onclick="addSale()">Registrar venta</button></div>`;el('stock').innerHTML=`<h2>Inventario</h2><div class="card">${db.products.map(p=>`<div class="line"><div><b>${safe(p.name)}</b><div class="muted">Venta ${money(p.price)} · Costo ${money(p.cost)}</div></div><div><b>${p.stock} uds.</b>${p.stock<=5?'<div class="error muted">Stock bajo</div>':''}</div></div>`).join('')}</div><div class="card"><h3>Nuevo producto</h3><label>Nombre</label><input id="pname" maxlength="70"><label>Precio de venta</label><input id="pprice" type="number" min="0.01" step="0.01"><label>Costo</label><input id="pcost" type="number" min="0" step="0.01"><label>Unidades</label><input id="pstock" type="number" min="0" step="1"><button onclick="addProduct()">Guardar producto</button></div>`;el('credit').innerHTML=`<h2>Fiados y cobros</h2><div class="card">${db.clients.map(c=>`<div class="line"><span>${safe(c.name)}</span><strong>${money(debt(c.id))}</strong></div>`).join('')}</div><div class="card"><h3>Registrar abono</h3><label>Cliente</label><select id="payClient">${db.clients.map(c=>`<option value="${c.id}">${safe(c.name)} · ${money(debt(c.id))}</option>`).join('')}</select><label>Importe (S/)</label><input id="payAmount" type="number" min="0.01" step="0.01"><label>Medio</label><select id="payMethod"><option>Efectivo</option><option>Yape</option><option>Plin</option><option>Transferencia</option></select><button onclick="addPayment()">Registrar cobro</button></div><div class="card"><h3>Nuevo cliente</h3><label>Nombre</label><input id="clientName" maxlength="70"><button class="secondary" onclick="addClient()">Agregar cliente</button></div>`;el('reports').innerHTML=`<h2>Reportes</h2><div class="card"><div class="line">Ventas totales <b>${money(revenue)}</b></div><div class="line">Ventas al contado <b>${money(cash)}</b></div><div class="line">Fiados pendientes <b>${money(out)}</b></div><div class="line">Abonos recibidos <b>${money(paid)}</b></div><div class="line">Ganancia bruta estimada <b>${money(profit)}</b></div></div><div class="card"><h3>Últimas operaciones</h3>${[...db.sales.map(s=>({date:s.date,label:'Venta '+(s.clientId?'fiada':'contado'),amount:s.total})),...db.payments.map(p=>({date:p.date,label:'Abono',amount:p.amount}))].sort((a,b)=>b.date.localeCompare(a.date)).slice(0,12).map(x=>`<div class="line"><div>${x.label}<div class="muted">${new Date(x.date).toLocaleString('es-PE')}</div></div><b>${money(x.amount)}</b></div>`).join('')||'<p class="muted">Aún no hay movimientos.</p>'}</div>`}function msg(s,error=false){el('message').className=error?'error':'success';el('message').textContent=s}function addSale(){const p=db.products.find(p=>p.id===Number(el('saleProduct').value)),q=Number(el('saleQty').value),c=el('saleClient').value;if(!Number.isSafeInteger(q)||q<1||q>p.stock)return msg('Cantidad inválida o stock insuficiente.',true);const total=Math.round(p.price*q*100)/100;db.sales.push({id:Date.now(),date:new Date().toISOString(),productId:p.id,quantity:q,total,profit:Math.round((p.price-p.cost)*q*100)/100,clientId:c?Number(c):null,method:c?null:el('saleMethod').value});p.stock-=q;save();tab('home');msg('Venta registrada. Inventario y saldos actualizados.')}function addPayment(){const id=Number(el('payClient').value),amount=Number(el('payAmount').value);if(!Number.isFinite(amount)||amount<=0||Math.round(amount*100)!==amount*100&&Math.abs(Math.round(amount*100)-amount*100)>0.00001||amount>Math.round(debt(id)*100)/100)return msg('Abono inválido o superior a la deuda.',true);db.payments.push({id:Date.now(),date:new Date().toISOString(),clientId:id,amount,method:el('payMethod').value});save();tab('credit');msg('Cobro registrado y deuda actualizada.')}function addClient(){const name=el('clientName').value.trim();if(name.length<2)return msg('Escribe un nombre válido.',true);db.clients.push({id:Date.now(),name});save();render();msg('Cliente agregado.')}function addProduct(){const name=el('pname').value.trim(),price=Number(el('pprice').value),cost=Number(el('pcost').value),stock=Number(el('pstock').value);if(name.length<2||!Number.isFinite(price)||price<=0||!Number.isFinite(cost)||cost<0||!Number.isSafeInteger(stock)||stock<0)return msg('Revisa los datos del producto.',true);db.products.push({id:Date.now(),name,price,cost,stock});save();render();msg('Producto agregado.')}</script></body></html>
